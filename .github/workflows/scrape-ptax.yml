name: Daily PTAX Scraper

on:
  schedule:
    # Weekdays at 17:00 UTC (~14:00 BRT) — after BCB publishes the daily PTAX.
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PTAX scraper
        run: node scripts/scrape-ptax.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/ptax.json

          if git diff --staged --quiet; then
            echo "No changes detected. Exiting gracefully."
            exit 0
          fi

          git commit -m "chore: auto-update BCB PTAX rate [skip ci]"
          git pull origin main --rebase
          git push origin main
