name: Monthly USA State Tax Scraper

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper dependency
        run: npm install --no-save cheerio@^1.0.0

      - name: Run scraper
        run: node scripts/scrape-state-tax.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/usa_state_tax.json

          if git diff --staged --quiet; then
            echo "No changes detected. Exiting gracefully."
            exit 0
          fi

          git commit -m "chore: auto-update USA state sales tax rates [skip ci]"
          git pull origin main --rebase
          git push origin main
